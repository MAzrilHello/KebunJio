name: Deploy to Cloud Run (BE) - CD

on:
  push:
    branches:
      - gcp-deploy

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build JAR
        working-directory: Backend/KebunJio
        run: mvn clean package -DskipTests=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        working-directory: Backend/KebunJio
        run: |
          docker build -t asia-southeast1-docker.pkg.dev/ultimate-ascent-449505-u0/kebunjio/kebunjio-backend:latest .
          docker push asia-southeast1-docker.pkg.dev/ultimate-ascent-449505-u0/kebunjio/kebunjio-backend:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy kebunjio-backend \
            --image asia-southeast1-docker.pkg.dev/ultimate-ascent-449505-u0/kebunjio/kebunjio-backend:latest \
            --platform managed \
            --region asia-southeast1 \
            --allow-unauthenticated
